name: Security & Code Scanning Enforcer

on:
  schedule:
    - cron: '0 0 1 */3 *' # Quarterly sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-security-settings:
    name: Enforce Security & Code Scanning across Org
    runs-on: ubuntu-latest

    steps:
      - name: Generate Cross-Repo App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Enforce Security & Scanning Settings
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          FAIL_COUNT=0
          FAILED_REPOS=()

          REPOS_JSON=$(gh api "orgs/$ORG_NAME/repos?per_page=100" --paginate --jq '.[] | select(.archived == false and .disabled == false) | {name: .name, private: .private}')

          while read -r repo_info; do
            [ -z "$repo_info" ] && continue

            repo=$(echo "$repo_info" | jq -r '.name')
            is_private=$(echo "$repo_info" | jq -r '.private')

            echo "=========================================="
            echo "Enforcing security for: $repo (Private: $is_private)"
            echo "=========================================="
            REPO_FAILED=0

            # A. Private Vulnerability Reporting
            if ! gh api "repos/$ORG_NAME/$repo/private-vulnerability-reporting" -X PUT > /dev/null 2>&1; then
              echo "::warning::Failed to enable Private Vulnerability Reporting for $repo"
              REPO_FAILED=1
            else
              echo "  ✓ Private Vulnerability Reporting enabled"
            fi

            # B. Dependabot Alerts
            if ! gh api "repos/$ORG_NAME/$repo/vulnerability-alerts" -X PUT > /dev/null 2>&1; then
              echo "::warning::Failed to enable Dependabot Alerts for $repo"
              REPO_FAILED=1
            else
              echo "  ✓ Dependabot Alerts enabled"
            fi

            # C. Dependabot Security Updates
            if ! gh api "repos/$ORG_NAME/$repo/automated-security-fixes" -X PUT > /dev/null 2>&1; then
              echo "::warning::Failed to enable Dependabot Security Updates for $repo"
              REPO_FAILED=1
            else
              echo "  ✓ Dependabot Security Updates enabled"
            fi

            # D. Secret Scanning & Push Protection (Public Repos Only)
            if [ "$is_private" = "false" ]; then
              PAYLOAD=$(jq -n '{
                security_and_analysis: {
                  secret_scanning: { status: "enabled" },
                  secret_scanning_push_protection: { status: "enabled" }
                }
              }')
              if ! gh api "repos/$ORG_NAME/$repo" -X PATCH --input - <<< "$PAYLOAD" > /dev/null 2>&1; then
                echo "::warning::Failed to enable Secret Scanning for public repo $repo"
                REPO_FAILED=1
              else
                echo "  ✓ Secret Scanning & Push Protection enabled"
              fi
            fi

            # E. CodeQL Default Setup (Extended Query Suite for Code Scanning & Quality)
            CODEQL_PAYLOAD=$(jq -n '{
              state: "configured",
              query_suite: "extended"
            }')
            if ! gh api "repos/$ORG_NAME/$repo/code-scanning/default-setup" -X PATCH --input - <<< "$CODEQL_PAYLOAD" > /dev/null 2>&1; then
              echo "::warning::CodeQL Default Setup not applicable or failed for $repo"
            else
              echo "  ✓ CodeQL Default Setup (extended suite) configured"
            fi

            if [ "$REPO_FAILED" -eq 1 ]; then
              FAIL_COUNT=$((FAIL_COUNT + 1))
              FAILED_REPOS+=("$repo")
            fi
          done < <(echo "$REPOS_JSON" | jq -c '.')

          echo ""
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::Security configuration failed for $FAIL_COUNT repo(s): ${FAILED_REPOS[*]}"
            exit 1
          else
            echo "Successfully enforced security settings across all active repositories."
          fi
